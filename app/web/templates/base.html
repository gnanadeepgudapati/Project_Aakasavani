<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Aakasavani{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Aakasavani</a>
  {% block chips %}{% endblock %}
  <div class="header-controls">
    <form class="search-form" action="/search" method="get" role="search">
      <input type="search" name="q" placeholder="Search your reads..." aria-label="Search your reading history">
    </form>
    <div class="density-toggle" role="group" aria-label="Image density">
      <button type="button" data-density-option="compact">Compact</button>
      <button type="button" data-density-option="comfortable">Comfortable</button>
      <button type="button" data-density-option="visual">Visual</button>
    </div>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
